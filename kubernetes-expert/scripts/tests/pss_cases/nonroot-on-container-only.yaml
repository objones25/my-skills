apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/name: x
  name: nonroot-on-container-only
  namespace: myapp
spec:
  automountServiceAccountToken: false
  containers:
  - image: r/x:1
    name: app
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
  securityContext:
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: myapp
