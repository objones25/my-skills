apiVersion: v1
kind: Pod
metadata:
  name: vol-shm
  namespace: myapp
spec:
  serviceAccountName: myapp
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: registry.example.com/infer:1.0.0
      resources:
        requests: {cpu: "1", memory: 4Gi}
        limits: {memory: 4Gi, nvidia.com/gpu: 1}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
