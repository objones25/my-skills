# Gateway API route (replacement for Ingress). Needs the Gateway API CRDs and a controller,
# plus a Gateway named below, usually owned by the platform team.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myapp
  labels:
    app.kubernetes.io/name: myapp
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway-system
  hostnames:
    - myapp.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: myapp
          port: 80
