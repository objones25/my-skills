schema_version: "1.1"
name: jax-pqn-truncation
expected_outcome: |
  A single-file JAX PQN script: Q-network with LayerNorm after hidden layers, no replay buffer and no target network, lambda-returns via reverse scan, epsilon-greedy with a schedule, whole training jitted with lax.scan and vmapped over envs (and ideally seeds). Handles Acrobot's 500-step time limit as truncation rather than termination when bootstrapping. Runs briefly on CPU and reports real output.
