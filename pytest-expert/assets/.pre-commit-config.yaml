# Pre-commit hooks: violations never reach the shared repo.
# Setup: pip install pre-commit, then pre-commit install --hook-type pre-commit --hook-type pre-push
# Keep the commit stage fast; the test run is on pre-push only.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: pytest-audit
        name: audit test suite
        entry: python scripts/audit_tests.py tests/
        language: system
        pass_filenames: false
        files: ^tests/.*\.py$

      - id: pytest-fast
        name: pytest (fast suite)
        entry: pytest -q -x --no-cov -p no:randomly
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
